name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # bash -eo pipefail

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Pytest with coverage gate
        # fail_under = 90 is configured in pyproject.toml ([tool.coverage.report]).
        run: pytest --cov=debate_system --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate changes and specs
        # Exits 0 with "No items found" when there are no active changes or specs,
        # so this also passes after every change has been archived.
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive

  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Smoke-test the wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/debate" --help
          "$RUNNER_TEMP/smoke/bin/debate" "Smoke test question" --json > smoke.json
          python - smoke.json <<'PY'
          import json, sys
          with open(sys.argv[1]) as fh:
              doc = json.load(fh)
          missing = {"final_answer", "confidence"} - doc.keys()
          assert not missing, f"missing keys in JSON output: {missing}"
          print("final_answer:", doc["final_answer"])
          PY

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: multi-agent-debate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (offline mock backend)
        run: |
          docker run --rm multi-agent-debate:ci --help
          docker run --rm multi-agent-debate:ci "Smoke test question" --json \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert 'final_answer' in d and 'confidence' in d, d.keys(); print('final_answer:', d['final_answer'])"
